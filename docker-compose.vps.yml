services:
  rostoid:
    build:
      context: .
      dockerfile: Dockerfile
    image: rostoid:latest
    restart: unless-stopped
    ports:
      - "3016:3016"
    env_file:
      - .env
    environment:
      PORT: "3016"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3016/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
